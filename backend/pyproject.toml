[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageglance-backend"
version = "0.1.0"
description = "PageGlance API backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "groq>=1.7,<2.0",
    "alembic>=1.13,<2.0",
    "openai>=1.50,<3.0",
    "pgvector>=0.3,<1.0",
    "Pillow>=10.0,<13.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pypdf>=5.0,<7.0",
    "PyMuPDF>=1.24,<2.0",
    "pytesseract>=0.3.13,<1.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["integration: requires a disposable local PostgreSQL database with pgvector"]
